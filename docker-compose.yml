version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mantis
      POSTGRES_USER: bz
      POSTGRES_PASSWORD: bz
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bz -d mantis"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./apps/web
    environment:
      DATABASE_URL: postgresql://bz:bz@db:5432/mantis
      SESSION_SECRET: change-me-in-production-min-32-chars-secret-key-12345
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-demo-secret}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
